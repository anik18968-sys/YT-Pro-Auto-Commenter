<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #181818; color: #fff; border-radius: 8px; margin: 0; }
    h3 { margin-top: 0; font-size: 16px; color: #ff4e4e; text-align: center; font-weight: bold; }
    textarea { width: 100%; height: 70px; background: #282828; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; box-sizing: border-box; resize: none; margin-bottom: 10px; font-size: 13px; outline: none; }
    textarea:focus { border-color: #065fd4; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; letter-spacing: 0.5px; }
    #saveBtn { background: #065fd4; }
    #saveBtn:hover { background: #0056b3; }
    #startBtn { background: #2ba640; display: none; }
    #startBtn:hover { background: #238c36; }
    #startBtn.running { background: #cc0000; }
    #status { text-align: center; font-size: 12px; margin-top: 10px; color: #aaa; }
  </style>
</head>
<body>
  <h3>YT Pro Auto Commenter</h3>
  <textarea id="commentText" placeholder="Enter comments here..."></textarea>
  
  <div class="btn-group">
    <button id="saveBtn">SAVE</button>
    <button id="startBtn">START</button>
  </div>
  <div id="status">Write a comment and click Save.</div>

  <script src="popup.js"></script>
</body>
</html>
